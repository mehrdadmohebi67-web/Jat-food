<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>ورود به جت‌فود</title>
<style>
:root{color-scheme:dark;--navy:#102a43;--teal:#19b6a4;--gold:#f4c76b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 15% 15%,#1c5267 0,transparent 40%),linear-gradient(135deg,#081c2b,#102a43 55%,#163b4b);color:#fff;display:grid;place-items:center;padding:24px}main{width:min(100%,760px);text-align:center}.brand{font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-1px;margin:0 0 10px}.brand span{color:var(--gold)}.lead{color:#d5e4ec;line-height:1.9;margin:0 auto 28px;max-width:540px}.card{display:block;text-decoration:none;color:inherit;max-width:440px;margin:auto;border:1px solid #ffffff35;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,#ffffff1c,#ffffff08);box-shadow:0 22px 65px #0005;transition:transform .18s,border-color .18s}.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--teal);outline:none}.art{min-height:210px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#1cc5ad44,transparent 52%),linear-gradient(135deg,#0f394a,#17606a)}.logo{width:112px;height:112px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(145deg,#ffdf8d,#efa943);color:#173347;font-size:52px;font-weight:900;box-shadow:0 14px 32px #0004}.card-body{padding:24px}.card h2{margin:0 0 10px;font-size:25px}.card p{margin:0;color:#d5e4ec;line-height:1.9}.go{display:inline-block;margin-top:20px;background:var(--teal);color:#062c34;font-weight:900;border-radius:14px;padding:13px 24px}.note{font-size:12px;color:#a9c0cc;margin-top:24px;line-height:1.8}
</style>
</head>
<body>
<main>
  <h1 class="brand">جت‌<span>فود</span></h1>
  <p class="lead">برای ورود به صفحه اصلی جت‌فود، کارت زیر را انتخاب کن.</p>
  <a class="card" href="./index.html" aria-label="ورود به صفحه اصلی جت‌فود">
    <div class="art"><div class="logo" aria-hidden="true">ج</div></div>
    <div class="card-body">
      <h2>صفحه اصلی جت‌فود</h2>
      <p>مشاهده رستوران‌ها، جست‌وجو و ورود به پنل اصلی جت‌فود</p>
      <span class="go">ورود به جت‌فود ←</span>
    </div>
  </a>
  <p class="note">این فایل فقط رابط ورود است و به فایل اصلی index.html دست نمی‌زند.</p>
</main>
</body>
</html>
